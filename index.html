<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영단어 마스터</title>
<style>
  :root{
    --bg: #FFF8EE;
    --card: #FFFFFF;
    --primary: #FF7A1A;
    --primary-dark: #E4650A;
    --primary-light: #FFE7CC;
    --accent: #FFC93C;
    --text: #2B2118;
    --sub: #9A8C7A;
    --border: #F1E6D8;
    --correct: #22B573;
    --wrong: #EF4B5D;
    --day-bg: #FFF1DE;
    --star: #FF7A1A;
    --shadow: 0 3px 14px rgba(120,80,20,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:430px; min-height:100vh;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative;
  }
  header{
    padding:16px 18px 12px; background:var(--bg);
    position:sticky; top:0; z-index:10;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand-badge{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, var(--primary), var(--accent));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(255,122,26,.32);
  }
  header h1{margin:0; font-size:17px; font-weight:800; letter-spacing:-.2px; white-space:nowrap;}
  .fav-badge{
    font-size:11px; font-weight:800; color:var(--primary-dark); background:var(--primary-light);
    padding:6px 11px; border-radius:999px; flex-shrink:0;
  }
  header p{margin:8px 0 0; font-size:12px; color:var(--sub); font-weight:600;}

  main{flex:1; padding:6px 14px 106px;}

  nav.tabbar{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    width:calc(100% - 24px); max-width:406px; background:var(--card);
    border-radius:20px; display:flex; z-index:20;
    box-shadow:0 8px 24px rgba(120,80,20,.16);
    padding:6px; gap:2px;
  }
  nav.tabbar button{
    flex:1; border:none; background:none; padding:8px 2px 7px;
    font-size:9.5px; color:var(--sub); font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border-radius:14px; transition:background .15s, color .15s;
  }
  nav.tabbar button .ic{display:flex;}
  nav.tabbar button.active{color:var(--primary-dark); background:var(--primary-light);}

  .tabpage{display:none;}
  .tabpage.active{display:block;}

  .mode-switch{
    display:flex; background:var(--card); box-shadow:var(--shadow);
    border-radius:14px; padding:4px; margin-bottom:8px; gap:4px;
  }
  .mode-switch button{
    flex:1; border:none; background:none; padding:9px 4px; font-size:11.5px;
    font-weight:700; color:var(--sub); border-radius:11px; transition:background .15s,color .15s;
  }
  .mode-switch button.active{background:var(--primary); color:#fff;}

  .spell-toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); box-shadow:var(--shadow); border-radius:14px;
    padding:11px 14px; margin-bottom:10px; font-size:12.5px; font-weight:700; color:var(--text);
  }

  .day-block{
    background:var(--card); border-radius:16px; overflow:hidden;
    margin-bottom:10px; box-shadow:var(--shadow);
  }
  .day-header{
    padding:13px 16px; display:flex; justify-content:space-between; align-items:center;
    background:var(--day-bg); cursor:pointer;
  }
  .day-header .day-title{font-weight:800; font-size:14.5px; color:var(--primary-dark);}
  .day-header .day-sub{font-size:11.5px; color:var(--sub); margin-top:2px;}
  .day-header .chevron{font-size:13px; color:var(--primary); transition:transform .2s;}
  .day-block.open .chevron{transform:rotate(180deg);}
  .word-list{display:none;}
  .day-block.open .word-list{display:block;}

  .word-card{
    padding:13px 16px; border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; user-select:none;
  }
  .word-card.expanded{align-items:flex-start;}
  .word-card.expanded .star{margin-top:2px;}
  .word-card:active{background:#FFFBF5;}
  .word-card .no{
    width:20px; font-size:10.5px; color:var(--sub); flex-shrink:0; text-align:center;
  }
  .word-face{flex:1; min-width:0;}
  .word-face .en{font-size:15.5px; font-weight:800; color:var(--text);}
  .word-face .kr{font-size:14px; font-weight:700; color:var(--primary-dark);}
  .word-face .kr.sub-line{font-size:12px; color:var(--sub); font-weight:500; margin-top:2px;}

  .spell-check-row{display:flex; gap:6px; margin-top:8px;}
  .spell-check-input{
    flex:1; padding:9px 11px; font-size:13px; border-radius:10px;
    border:1.5px solid var(--border); outline:none; font-weight:600; color:var(--text);
    background:var(--bg);
  }
  .spell-check-input:focus{border-color:var(--primary);}
  .spell-check-input.correct{border-color:var(--correct); background:#EAFBF3;}
  .spell-check-input.wrong{border-color:var(--wrong); background:#FDEEF0;}
  .spell-check-btn{
    padding:9px 13px; font-size:12.5px; font-weight:800; border-radius:10px;
    border:none; background:var(--primary); color:#fff; flex-shrink:0;
  }
  .spell-check-feedback{margin-top:6px; font-size:12px; font-weight:700; display:none;}
  .spell-check-feedback.show{display:block;}
  .spell-check-feedback.correct{color:var(--correct);}
  .spell-check-feedback.wrong{color:var(--wrong);}

  .star{
    font-size:20px; color:#E9DFD2; flex-shrink:0; line-height:1; padding:2px 4px;
    transition:color .15s, transform .15s;
  }
  .star.active{color:var(--star); transform:scale(1.05);}

  .fav-flat-list{
    background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
  }
  .fav-flat-list .word-card{border-top:1px solid var(--border);}
  .fav-flat-list .word-card:first-child{border-top:none;}
  .empty-star{font-size:42px; color:#F2DFC4; margin-bottom:10px;}

  /* ---------- Quiz setup ---------- */
  .setup-card{
    background:var(--card); border-radius:18px; padding:18px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .setup-card h3{margin:0 0 10px; font-size:14px; font-weight:800; color:var(--text);}
  .setup-toolbar{display:flex; gap:8px; margin-bottom:10px;}
  .setup-toolbar button{
    flex:1; padding:9px; font-size:12px; font-weight:700; border-radius:10px;
    border:1.5px solid var(--border); background:var(--bg); color:var(--sub);
  }
  .day-chip-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:4px;}
  .day-chip{
    padding:9px 2px; text-align:center; border-radius:10px; font-size:11.5px; font-weight:700;
    border:1.5px solid var(--border); color:var(--sub); background:var(--bg);
  }
  .day-chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

  .fav-only-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--border);
  }
  .fav-only-row span{font-size:13.5px; font-weight:700; color:var(--text);}
  .switch{
    width:44px; height:26px; border-radius:20px; background:var(--border);
    position:relative; flex-shrink:0; transition:background .2s;
  }
  .switch.on{background:var(--primary);}
  .switch .knob{
    position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
    background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.18);
  }
  .switch.on .knob{left:20px;}
  .switch.small{width:34px; height:20px;}
  .switch.small .knob{width:16px; height:16px;}
  .switch.small.on .knob{left:16px;}

  .pool-count{font-size:12px; color:var(--sub); margin-top:10px; text-align:center; font-weight:600;}

  /* ---------- Quiz page ---------- */
  .quiz-topbar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .quiz-stats{display:flex; gap:8px; font-size:11.5px; color:var(--sub); font-weight:700;}
  .quiz-stats span{background:var(--card); box-shadow:var(--shadow); padding:5px 9px; border-radius:999px;}
  .quiz-stats b{color:var(--text);}
  .quiz-stats .ok{color:var(--correct);}
  .quiz-stats .no{color:var(--wrong);}
  .end-btn{
    border:none; background:var(--card); color:var(--sub); box-shadow:var(--shadow);
    font-size:11.5px; font-weight:700; padding:8px 13px; border-radius:12px;
  }

  .quiz-card{
    background:var(--card); border-radius:18px; padding:22px 18px;
    box-shadow:var(--shadow); margin-bottom:14px;
  }
  .quiz-card .label-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;
  }
  .quiz-card .label{
    font-size:11px; color:var(--primary-dark); font-weight:800;
    letter-spacing:.3px; background:var(--primary-light); padding:4px 9px; border-radius:999px;
  }
  .toggle-group{display:flex; gap:10px; flex-shrink:0;}
  .trans-toggle{
    display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub); font-weight:700;
  }
  .quiz-card .sentence{
    font-size:16.5px; line-height:1.65; font-weight:700; color:var(--text);
  }
  .quiz-card .sentence .blank-slot{
    display:inline-block; min-width:74px; border-bottom:2.5px solid var(--primary);
    text-align:center; font-weight:800; color:var(--primary-dark);
  }
  .quiz-card .kr-trans{
    margin-top:12px; font-size:13px; color:var(--sub); line-height:1.5;
    padding-top:12px; border-top:1.5px dashed var(--border);
  }
  .quiz-card .hint-line{
    margin-top:12px; font-size:12.5px; color:var(--primary-dark); font-weight:700;
    background:var(--primary-light); display:inline-block; padding:6px 11px; border-radius:10px;
  }

  .answer-row{display:flex; gap:8px; margin-bottom:10px;}
  .answer-row input{
    flex:1; padding:14px 15px; font-size:16px; border-radius:14px;
    border:1.5px solid var(--border); outline:none; font-weight:600;
    color:var(--text); background:var(--card);
  }
  .answer-row input:focus{border-color:var(--primary);}
  .answer-row input.correct{border-color:var(--correct); background:#EAFBF3;}
  .answer-row input.wrong{border-color:var(--wrong); background:#FDEEF0;}

  .btn{
    padding:14px 16px; border-radius:14px; border:none; font-size:15px;
    font-weight:800; cursor:pointer; transition:transform .1s, background .15s;
  }
  .btn-primary{background:var(--primary); color:#fff; width:100%; box-shadow:0 6px 16px rgba(255,122,26,.3);}
  .btn-primary:active{background:var(--primary-dark); transform:scale(.98);}
  .btn-secondary{background:var(--card); color:var(--primary-dark); width:100%; border:1.5px solid var(--primary-light); margin-top:8px;}

  .choice-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .choice-btn{
    padding:14px 15px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--card); font-size:14.5px; font-weight:700; color:var(--text);
    text-align:left; transition:border-color .15s, background .15s;
  }
  .choice-btn:disabled{opacity:.9;}
  .choice-btn.correct{border-color:var(--correct); background:#EAFBF3; color:var(--correct); font-weight:800;}
  .choice-btn.wrong{border-color:var(--wrong); background:#FDEEF0; color:var(--wrong); font-weight:800;}

  .feedback{
    margin-top:10px; font-size:13.5px; font-weight:800; display:none;
    padding:11px 13px; border-radius:12px;
  }
  .feedback.show{display:block;}
  .feedback.correct{background:#EAFBF3; color:var(--correct);}
  .feedback.wrong{background:#FDEEF0; color:var(--wrong);}
  .feedback .ans{font-weight:800;}

  .result-box{
    text-align:center; padding:34px 16px; background:var(--card);
    border-radius:18px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .result-box .big{font-size:26px; font-weight:900; color:var(--primary-dark); margin-bottom:16px;}
  .result-summary{
    display:flex; justify-content:center; gap:18px; margin-bottom:6px;
  }
  .result-summary div{font-size:12.5px; color:var(--sub); font-weight:600;}
  .result-summary div b{display:block; font-size:20px; color:var(--text); margin-top:3px;}
  .result-summary div.ok b{color:var(--correct);}
  .result-summary div.no b{color:var(--wrong);}

  .wrong-list-title{
    font-size:13.5px; font-weight:800; margin:16px 2px 8px; color:var(--text);
  }
  .wrong-item{
    background:var(--card); box-shadow:var(--shadow); border-radius:14px;
    padding:13px 15px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:8px;
  }
  .wrong-item .wi-word{font-size:14.5px; font-weight:800; color:var(--text);}
  .wrong-item .wi-meaning{font-size:12px; color:var(--sub); margin-top:2px;}
  .wrong-item .wi-answer{font-size:11.5px; color:var(--wrong); margin-top:3px; font-weight:600;}

  .empty-note{
    text-align:center; color:var(--sub); font-size:13px; padding:50px 10px; font-weight:600;
  }
</style>
</head>
<body>
<div id="app">

    <header>
    <div class="header-row">
      <div class="brand">
        <span class="brand-badge"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.6-1-4-1.5-6-1.2C4.9 5.4 4 6.2 4 7.2v10.3c0 .8.8 1.3 1.6 1.1 1.9-.4 4-.1 5.6.9V6.5Z"/><path d="M12 6.5c1.6-1 4-1.5 6-1.2 1.1.2 2 1 2 2v10.3c0 .8-.8 1.3-1.6 1.1-1.9-.4-4-.1-5.6.9V6.5Z"/></svg></span>
        <h1>영단어 마스터</h1>
      </div>
      <span class="fav-badge" id="favBadge">즐겨찾기 0</span>
    </div>
    <p id="headerSub">DAY 21~28, 39~50 · 600 단어</p>
  </header>

  <main>
    <!-- ================= TAB 1: 단어장 ================= -->
    <section id="page-list" class="tabpage active">
      <div class="mode-switch" id="modeSwitchList">
        <button data-mode="meaning" onclick="setDisplayMode('meaning')">뜻 먼저</button>
        <button data-mode="word" class="active" onclick="setDisplayMode('word')">영단어 먼저</button>
        <button data-mode="both" onclick="setDisplayMode('both')">둘 다 보기</button>
      </div>
      <div class="spell-toggle-row" id="spellToggleRowList" style="display:none;">
        <span>뜻 보고 스펠링 확인하기</span>
        <div class="switch" id="spellToggleSwitchList" onclick="toggleSpellingTest()"><div class="knob"></div></div>
      </div>
      <div id="dayContainer"></div>
    </section>

    <!-- ================= TAB 2: 즐겨찾기 ================= -->
    <section id="page-fav" class="tabpage">
      <div class="mode-switch">
        <button data-mode="meaning" onclick="setDisplayMode('meaning')">뜻 먼저</button>
        <button data-mode="word" class="active" onclick="setDisplayMode('word')">영단어 먼저</button>
        <button data-mode="both" onclick="setDisplayMode('both')">둘 다 보기</button>
      </div>
      <div class="spell-toggle-row" id="spellToggleRowFav" style="display:none;">
        <span>뜻 보고 스펠링 확인하기</span>
        <div class="switch" id="spellToggleSwitchFav" onclick="toggleSpellingTest()"><div class="knob"></div></div>
      </div>
      <div id="favContainer"></div>
    </section>

    <!-- ================= TAB 3: 빈칸연습 ================= -->
    <section id="page-quiz" class="tabpage">
      <div id="quizArea"></div>
    </section>

    <!-- ================= TAB 4: 스펠링연습 ================= -->
    <section id="page-spell" class="tabpage">
      <div id="spellArea"></div>
    </section>

    <!-- ================= TAB 5: 뜻고르기(5지선다) ================= -->
    <section id="page-choice" class="tabpage">
      <div id="choiceArea"></div>
    </section>
  </main>

    <nav class="tabbar">
    <button id="tabBtnList" class="active" onclick="switchTab('list')">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.6-1-4-1.5-6-1.2C4.9 5.4 4 6.2 4 7.2v10.3c0 .8.8 1.3 1.6 1.1 1.9-.4 4-.1 5.6.9V6.5Z"/><path d="M12 6.5c1.6-1 4-1.5 6-1.2 1.1.2 2 1 2 2v10.3c0 .8-.8 1.3-1.6 1.1-1.9-.4-4-.1-5.6.9V6.5Z"/></svg></span>단어장
    </button>
    <button id="tabBtnFav" onclick="switchTab('fav')">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.47 5.01 5.53.8-4 3.9.95 5.5L12 16.9l-4.95 2.6.95-5.5-4-3.9 5.53-.8L12 3.5Z"/></svg></span>즐겨찾기
    </button>
    <button id="tabBtnQuiz" onclick="switchTab('blank')">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.2L15.6 5.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20Z"/><path d="M13.5 7.3l3.2 3.2"/></svg></span>빈칸
    </button>
    <button id="tabBtnSpell" onclick="switchTab('spell')">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="11" rx="2.5"/><path d="M7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M8 14.2h8"/></svg></span>스펠링
    </button>
    <button id="tabBtnChoice" onclick="switchTab('choice')">
      <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span>뜻고르기
    </button>
  </nav>

</div>

<script>
/* =======================================================

/* =======================================================
   즐겨찾기 로컬 저장 (localStorage)
   같은 아이폰의 같은 브라우저/홈 화면 아이콘에서는
   새로고침해도 즐겨찾기가 유지됩니다.
   ======================================================= */
const FAV_STORAGE_KEY = 'vocabmaster_favorites_v1';

function loadFavoritesFromStorage(){
  try{
    const raw = localStorage.getItem(FAV_STORAGE_KEY);
    if(!raw) return;
    const favNos = new Set(JSON.parse(raw));
    wordData.forEach(w => { w.fav = favNos.has(w.no); });
  }catch(e){
    console.warn('즐겨찾기 데이터를 불러오지 못했습니다.', e);
  }
}

function saveFavoritesToStorage(){
  try{
    const favNos = wordData.filter(w => w.fav).map(w => w.no);
    localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favNos));
  }catch(e){
    console.warn('즐겨찾기 데이터를 저장하지 못했습니다.', e);
  }
}

loadFavoritesFromStorage();

function updateFavBadge(){
  const el = document.getElementById('favBadge');
  if(!el) return;
  const n = wordData.filter(w => w.fav).length;
  el.textContent = `즐겨찾기 ${n}`;
}
updateFavBadge();

/* 카드별 "뒤집힘" 상태 (word/meaning 모드에서만 사용) */
const revealedState = {};
wordData.forEach(w => revealedState[w.no] = false);

let displayMode = 'word'; // 'word' | 'meaning' | 'both'
let spellingTestMode = false; // 뜻먼저 모드에서 스펠링 자가 확인 켜기/끄기

/* =======================================================
   2. 표시 모드 스위치 (단어장 / 즐겨찾기 공용)
   ======================================================= */
function setDisplayMode(mode){
  displayMode = mode;
  document.querySelectorAll('.mode-switch button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  wordData.forEach(w => revealedState[w.no] = false);

  const showSpellRow = (mode === 'meaning');
  document.getElementById('spellToggleRowList').style.display = showSpellRow ? 'flex' : 'none';
  document.getElementById('spellToggleRowFav').style.display = showSpellRow ? 'flex' : 'none';

  buildWordList();
  buildFavList();
}

function toggleSpellingTest(){
  spellingTestMode = !spellingTestMode;
  document.getElementById('spellToggleSwitchList').classList.toggle('on', spellingTestMode);
  document.getElementById('spellToggleSwitchFav').classList.toggle('on', spellingTestMode);
  buildWordList();
  buildFavList();
}

/* =======================================================
   3. 단어 카드 렌더링 (단어장 / 즐겨찾기 공용)
   ======================================================= */
function createWordCard(w, onChange){
  const card = document.createElement('div');
  card.dataset.no = w.no;

  const revealed = revealedState[w.no];
  let faceHtml = '';
  let showSpellCheck = false;

  if(displayMode === 'both'){
    faceHtml = `
      <div class="en">${w.word}</div>
      <div class="kr sub-line">${w.meaning}</div>
    `;
  } else if(displayMode === 'word'){
    faceHtml = revealed
      ? `<div class="kr">${w.meaning}</div>`
      : `<div class="en">${w.word}</div>`;
  } else {
    if(revealed){
      faceHtml = `<div class="en">${w.word}</div>`;
    } else {
      faceHtml = `<div class="kr">${w.meaning}</div>`;
      showSpellCheck = spellingTestMode;
    }
  }

  card.className = 'word-card' + (showSpellCheck ? ' expanded' : '');

  card.innerHTML = `
    <div class="no">${w.no}</div>
    <div class="word-face">
      ${faceHtml}
      ${showSpellCheck ? `
        <div class="spell-check-row">
          <input type="text" class="spell-check-input" placeholder="영어 스펠링 입력" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="spell-check-btn" type="button">확인</button>
        </div>
        <div class="spell-check-feedback"></div>
      ` : ''}
    </div>
    <div class="star ${w.fav ? 'active' : ''}" data-star="${w.no}">${w.fav ? '★' : '☆'}</div>
  `;

  if(displayMode !== 'both'){
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.star')) return;
      if(e.target.closest('.spell-check-row')) return;
      revealedState[w.no] = !revealedState[w.no];
      if(onChange) onChange(); else { buildWordList(); buildFavList(); }
    });
  }

  const star = card.querySelector('.star');
  star.addEventListener('click', (e)=>{
    e.stopPropagation();
    w.fav = !w.fav;
    saveFavoritesToStorage();
    updateFavBadge();
    if(onChange) onChange(); else { buildWordList(); buildFavList(); }
  });

  if(showSpellCheck){
    const input = card.querySelector('.spell-check-input');
    const btn = card.querySelector('.spell-check-btn');
    const fb = card.querySelector('.spell-check-feedback');
    const doCheck = ()=>{
      const val = input.value.trim().toLowerCase();
      if(!val) return;
      const correct = val === w.word.toLowerCase();
      input.classList.toggle('correct', correct);
      input.classList.toggle('wrong', !correct);
      fb.className = 'spell-check-feedback show ' + (correct ? 'correct' : 'wrong');
      fb.textContent = correct ? '정답이에요!' : `다시 시도해 보세요`;
      if(correct){
        input.disabled = true;
        btn.disabled = true;
        setTimeout(()=>{
          revealedState[w.no] = true;
          if(onChange) onChange(); else { buildWordList(); buildFavList(); }
        }, 700);
      }
      // 오답이면 잠그지 않고 바로 다시 시도할 수 있게 둠
    };
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); doCheck(); });
    input.addEventListener('click', (e)=> e.stopPropagation());
    input.addEventListener('input', ()=>{
      if(input.classList.contains('wrong')){
        input.classList.remove('wrong');
        fb.className = 'spell-check-feedback';
        fb.textContent = '';
      }
    });
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.stopPropagation(); doCheck(); }
    });
  }

  return card;
}

/* =======================================================
   4. 단어장 탭 (Day 아코디언)
   ======================================================= */
const openDays = {};

function buildWordList(){
  const days = {};
  wordData.forEach(w=>{
    if(!days[w.day]) days[w.day] = [];
    days[w.day].push(w);
  });

  const container = document.getElementById('dayContainer');
  container.innerHTML = '';

  Object.keys(days).forEach((dayName, idx)=>{
    if(!(dayName in openDays)) openDays[dayName] = (idx === 0);
    const words = days[dayName];
    const block = document.createElement('div');
    block.className = 'day-block' + (openDays[dayName] ? ' open':'');

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `
      <div>
        <div class="day-title">${dayName}</div>
        <div class="day-sub">${words.length}개 단어</div>
      </div>
      <div class="chevron">▼</div>
    `;
    header.onclick = ()=>{
      openDays[dayName] = !openDays[dayName];
      block.classList.toggle('open');
    };

    const list = document.createElement('div');
    list.className = 'word-list';
    words.forEach(w => list.appendChild(createWordCard(w)));

    block.appendChild(header);
    block.appendChild(list);
    container.appendChild(block);
  });
}

/* =======================================================
   5. 즐겨찾기 탭
   ======================================================= */
function buildFavList(){
  const container = document.getElementById('favContainer');
  const favWords = wordData.filter(w => w.fav);

  if(favWords.length === 0){
    container.innerHTML = `<div class="empty-note"><div class="empty-star">☆</div>아직 즐겨찾기한 단어가 없어요.<br>단어장에서 별표를 눌러 추가해보세요.</div>`;
    return;
  }

  container.innerHTML = '';
  const flat = document.createElement('div');
  flat.className = 'fav-flat-list';
  favWords.forEach(w => flat.appendChild(createWordCard(w)));
  container.appendChild(flat);
}

/* =======================================================
   6. 퀴즈 공용 엔진 (빈칸연습 / 스펠링연습 / 뜻고르기)
   ======================================================= */
const QUIZ_META = {
  blank:  { area: 'quizArea',   title: '예문 빈칸 채우기' },
  spell:  { area: 'spellArea',  title: '뜻 보고 스펠링 쓰기' },
  choice: { area: 'choiceArea', title: '단어 보고 뜻 고르기' },
};

function makeQuizState(){
  return {
    started: false,
    answered: false,
    pool: [],
    idx: 0,
    stats: { total: 0, correct: 0, wrong: 0 },
    wrongMap: {},
    selectedDays: new Set(ALL_DAYS),
    favOnly: false,
  };
}

const quiz = {
  blank: makeQuizState(),
  spell: makeQuizState(),
  choice: makeQuizState(),
};

let showTranslation = true;              // 빈칸연습 전용: 해석 보기
let hintToggles = { blank: false, spell: false }; // 첫 글자 힌트 (빈칸/스펠링)

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getFilteredPool(type){
  const q = quiz[type];
  return wordData.filter(w => q.selectedDays.has(w.day) && (!q.favOnly || w.fav));
}

function buildBlankSentence(item){
  const re = new RegExp(item.answer.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
  return item.example.replace(re, '<span class="blank-slot">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
}

/* ---------- 출제 범위 설정 화면 ---------- */
function renderQuizSetup(type, msg){
  const q = quiz[type];
  const area = document.getElementById(QUIZ_META[type].area);
  const poolSize = getFilteredPool(type).length;

  const dayChips = ALL_DAYS.map(d => `
    <div class="day-chip ${q.selectedDays.has(d) ? 'active':''}" onclick="toggleDayChip('${type}','${d}')">${d.replace('DAY ','D')}</div>
  `).join('');

  area.innerHTML = `
    <div class="setup-card">
      <h3>${QUIZ_META[type].title} · 출제 범위 설정</h3>
      <div class="setup-toolbar">
        <button onclick="selectAllDays('${type}')">전체 선택</button>
        <button onclick="clearAllDays('${type}')">전체 해제</button>
      </div>
      <div class="day-chip-grid">${dayChips}</div>

      <div class="fav-only-row">
        <span>즐겨찾기한 단어만 출제</span>
        <div class="switch ${q.favOnly ? 'on':''}" onclick="toggleFavOnly('${type}')"><div class="knob"></div></div>
      </div>

      <div class="pool-count">현재 설정으로 <b>${poolSize}</b>개 단어가 출제됩니다.</div>
    </div>
    ${msg ? `<div class="feedback show wrong">${msg}</div>` : ''}
    <button class="btn btn-primary" onclick="startQuiz('${type}')">${QUIZ_META[type].title} 시작하기</button>
  `;
}

function toggleDayChip(type, day){
  const q = quiz[type];
  if(q.selectedDays.has(day)) q.selectedDays.delete(day); else q.selectedDays.add(day);
  renderQuizSetup(type);
}
function selectAllDays(type){ quiz[type].selectedDays = new Set(ALL_DAYS); renderQuizSetup(type); }
function clearAllDays(type){ quiz[type].selectedDays = new Set(); renderQuizSetup(type); }
function toggleFavOnly(type){ quiz[type].favOnly = !quiz[type].favOnly; renderQuizSetup(type); }

function getNextQuizItem(type){
  const q = quiz[type];
  if(q.idx >= q.pool.length){
    q.pool = shuffle(getFilteredPool(type));
    q.idx = 0;
  }
  return q.pool[q.idx++];
}

function startQuiz(type){
  const q = quiz[type];
  const pool = getFilteredPool(type);
  if(pool.length === 0){
    renderQuizSetup(type, '선택한 조건에 해당하는 단어가 없어요. 범위를 다시 선택해주세요.');
    return;
  }
  if(type === 'choice' && pool.length < 5){
    renderQuizSetup(type, '5지선다 문제를 내려면 최소 5개 단어가 필요해요. 범위를 넓혀주세요.');
    return;
  }
  q.started = true;
  q.pool = shuffle(pool);
  q.idx = 0;
  q.stats = { total: 0, correct: 0, wrong: 0 };
  q.wrongMap = {};
  renderQuizQuestion(type);
}

/* ---------- 문제 렌더링 (타입별 분기) ---------- */
function statsBarHtml(type){
  const q = quiz[type];
  return `
    <div class="quiz-topbar">
      <div class="quiz-stats">
        <span>푼 문제 <b>${q.stats.total}</b></span>
        <span class="ok">맞음 <b>${q.stats.correct}</b></span>
        <span class="no">틀림 <b>${q.stats.wrong}</b></span>
      </div>
      <button class="end-btn" onclick="endQuiz('${type}')">그만 풀기</button>
    </div>
  `;
}

function buildChoiceOptions(item, type){
  const pool = getFilteredPool(type).filter(w => w.no !== item.no);
  const distractors = shuffle(pool).slice(0, 4).map(w => w.meaning);
  return shuffle([item.meaning, ...distractors]);
}

function renderQuizQuestion(type){
  const q = quiz[type];
  const area = document.getElementById(QUIZ_META[type].area);
  const item = getNextQuizItem(type);
  q.answered = false;
  area.dataset.currentNo = item.no;

  const topBar = statsBarHtml(type);

  if(type === 'blank'){
    area.innerHTML = topBar + `
      <div class="quiz-card">
        <div class="label-row">
          <div class="label">예문 빈칸 채우기 · ${item.day}</div>
          <div class="toggle-group">
            <div class="trans-toggle toggle-trans" onclick="toggleTranslation()">
              <span>해석</span><div class="switch small ${showTranslation ? 'on':''}"><div class="knob"></div></div>
            </div>
            <div class="trans-toggle toggle-firstletter" onclick="toggleFirstLetter('blank')">
              <span>첫글자</span><div class="switch small ${hintToggles.blank ? 'on':''}"><div class="knob"></div></div>
            </div>
          </div>
        </div>
        <div class="sentence">${buildBlankSentence(item)}</div>
        ${showTranslation && item.kr ? `<div class="kr-trans">${item.kr}</div>` : ''}
        ${hintToggles.blank ? `<div class="hint-line">정답은 <b>${item.answer[0].toUpperCase()}</b>로 시작해요</div>` : ''}
      </div>
      <div class="answer-row">
        <input type="text" id="quizInput_blank" placeholder="정답 철자를 입력하세요" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" id="quizActionBtn_blank" onclick="checkTypedAnswer('blank')">확인</button>
      <div class="feedback" id="quizFeedback_blank"></div>
    `;
  } else if(type === 'spell'){
    area.innerHTML = topBar + `
      <div class="quiz-card">
        <div class="label-row">
          <div class="label">뜻 보고 스펠링 쓰기 · ${item.day}</div>
          <div class="toggle-group">
            <div class="trans-toggle toggle-firstletter" onclick="toggleFirstLetter('spell')">
              <span>첫글자</span><div class="switch small ${hintToggles.spell ? 'on':''}"><div class="knob"></div></div>
            </div>
          </div>
        </div>
        <div class="sentence">${item.meaning}</div>
        ${hintToggles.spell ? `<div class="hint-line">정답은 <b>${item.word[0].toUpperCase()}</b>로 시작해요 (${item.word.length}글자)</div>` : ''}
      </div>
      <div class="answer-row">
        <input type="text" id="quizInput_spell" placeholder="영단어 스펠링을 입력하세요" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" id="quizActionBtn_spell" onclick="checkTypedAnswer('spell')">확인</button>
      <div class="feedback" id="quizFeedback_spell"></div>
    `;
  } else if(type === 'choice'){
    const options = buildChoiceOptions(item, type);
    area.innerHTML = topBar + `
      <div class="quiz-card">
        <div class="label">단어 보고 뜻 고르기 · ${item.day}</div>
        <div class="sentence">${item.word}</div>
      </div>
      <div class="choice-list" id="choiceList_choice">
        ${options.map(opt => `<button class="choice-btn" data-correct="${opt === item.meaning}" onclick="checkChoiceAnswer('choice', this, ${item.no})">${opt}</button>`).join('')}
      </div>
      <div class="feedback" id="quizFeedback_choice"></div>
    `;
  }

  const input = document.getElementById(`quizInput_${type}`);
  if(input){
    input.focus();
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        if(!q.answered) checkTypedAnswer(type);
        else renderQuizQuestion(type);
      }
    });
  }
}

/* ---------- 해석 / 첫글자 힌트 토글 (입력값 유지 위해 부분 갱신) ---------- */
function toggleTranslation(){
  showTranslation = !showTranslation;
  const area = document.getElementById(QUIZ_META.blank.area);
  const sw = area.querySelector('.toggle-trans .switch');
  if(sw) sw.classList.toggle('on', showTranslation);

  const card = area.querySelector('.quiz-card');
  const no = area.dataset.currentNo;
  const item = wordData.find(w => String(w.no) === String(no));
  let kr = card.querySelector('.kr-trans');

  if(showTranslation && item && item.kr){
    if(!kr){
      kr = document.createElement('div');
      kr.className = 'kr-trans';
      const hint = card.querySelector('.hint-line');
      if(hint) card.insertBefore(kr, hint); else card.appendChild(kr);
    }
    kr.textContent = item.kr;
  } else if(kr){
    kr.remove();
  }
}

function toggleFirstLetter(type){
  hintToggles[type] = !hintToggles[type];
  const area = document.getElementById(QUIZ_META[type].area);
  const sw = area.querySelector('.toggle-firstletter .switch');
  if(sw) sw.classList.toggle('on', hintToggles[type]);

  const card = area.querySelector('.quiz-card');
  const no = area.dataset.currentNo;
  const item = wordData.find(w => String(w.no) === String(no));
  let hint = card.querySelector('.hint-line');
  const targetWord = (type === 'blank') ? item.answer : item.word;

  if(hintToggles[type] && item){
    if(!hint){
      hint = document.createElement('div');
      hint.className = 'hint-line';
      card.appendChild(hint);
    }
    const hintText = (type === 'blank')
      ? `정답은 <b>${targetWord[0].toUpperCase()}</b>로 시작해요`
      : `정답은 <b>${targetWord[0].toUpperCase()}</b>로 시작해요 (${targetWord.length}글자)`;
    hint.innerHTML = hintText;
  } else if(hint){
    hint.remove();
  }
}

/* ---------- 채점: 타이핑형 (빈칸연습 / 스펠링연습) ---------- */
function checkTypedAnswer(type){
  const q = quiz[type];
  if(q.answered) return;
  const area = document.getElementById(QUIZ_META[type].area);
  const no = area.dataset.currentNo;
  const item = wordData.find(w => String(w.no) === String(no));
  const input = document.getElementById(`quizInput_${type}`);
  const userVal = input.value.trim().toLowerCase();
  const correctVal = (type === 'blank' ? item.answer : item.word).toLowerCase();
  const isCorrect = userVal === correctVal;

  q.answered = true;
  q.stats.total++;
  if(isCorrect){ q.stats.correct++; } else { q.stats.wrong++; q.wrongMap[item.no] = item; }

  input.classList.add(isCorrect ? 'correct' : 'wrong');
  input.disabled = true;

  const fb = document.getElementById(`quizFeedback_${type}`);
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect
    ? `정답이에요!`
    : `오답이에요. 정답: <span class="ans">${type === 'blank' ? item.answer : item.word}</span>`;

  const stats = area.querySelector('.quiz-stats');
  if(stats){
    stats.innerHTML = `
      <span>푼 문제 <b>${q.stats.total}</b></span>
      <span class="ok">맞음 <b>${q.stats.correct}</b></span>
      <span class="no">틀림 <b>${q.stats.wrong}</b></span>
    `;
  }

  const btn = document.getElementById(`quizActionBtn_${type}`);
  btn.textContent = '다음 문제';
  btn.onclick = ()=> renderQuizQuestion(type);
}

/* ---------- 채점: 5지선다 (뜻고르기) ---------- */
function checkChoiceAnswer(type, btnEl, no){
  const q = quiz[type];
  if(q.answered) return;
  const area = document.getElementById(QUIZ_META[type].area);
  const item = wordData.find(w => String(w.no) === String(no));
  const isCorrect = btnEl.dataset.correct === 'true';

  q.answered = true;
  q.stats.total++;
  if(isCorrect){ q.stats.correct++; } else { q.stats.wrong++; q.wrongMap[item.no] = item; }

  area.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.dataset.correct === 'true') b.classList.add('correct');
    else if(b === btnEl) b.classList.add('wrong');
  });

  const fb = document.getElementById(`quizFeedback_${type}`);
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect ? `정답이에요!` : `오답이에요. 정답: <span class="ans">${item.meaning}</span>`;

  const stats = area.querySelector('.quiz-stats');
  if(stats){
    stats.innerHTML = `
      <span>푼 문제 <b>${q.stats.total}</b></span>
      <span class="ok">맞음 <b>${q.stats.correct}</b></span>
      <span class="no">틀림 <b>${q.stats.wrong}</b></span>
    `;
  }

  if(!document.getElementById('choiceNextBtn')){
    const nextBtn = document.createElement('button');
    nextBtn.id = 'choiceNextBtn';
    nextBtn.className = 'btn btn-primary';
    nextBtn.style.marginTop = '4px';
    nextBtn.textContent = '다음 문제';
    nextBtn.onclick = ()=> renderQuizQuestion('choice');
    fb.insertAdjacentElement('afterend', nextBtn);
  }
}

/* ---------- 세션 종료: 결과 + 틀린 단어 목록 ---------- */
function endQuiz(type){
  const q = quiz[type];
  q.started = false;
  const area = document.getElementById(QUIZ_META[type].area);
  const wrongItems = Object.values(q.wrongMap);

  let wrongHtml = '';
  if(wrongItems.length > 0){
    wrongHtml = `<div class="wrong-list-title">틀린 단어 (${wrongItems.length}개) · 별표를 눌러 즐겨찾기에 추가해보세요</div>`;
    wrongItems.forEach(w=>{
      const showAnswerLine = (type === 'blank' && w.answer.toLowerCase() !== w.word.toLowerCase());
      wrongHtml += `
        <div class="wrong-item" data-no="${w.no}">
          <div>
            <div class="wi-word">${w.word}</div>
            <div class="wi-meaning">${w.meaning}</div>
            ${showAnswerLine ? `<div class="wi-answer">예문 속 표기: ${w.answer}</div>` : ''}
          </div>
          <div class="star ${w.fav ? 'active' : ''}" data-star="${w.no}">${w.fav ? '★' : '☆'}</div>
        </div>
      `;
    });
  }

  area.innerHTML = `
    <div class="result-box">
      <div class="big">수고했어요!</div>
      <div class="result-summary">
        <div>푼 문제<b>${q.stats.total}</b></div>
        <div class="ok">맞은 문제<b>${q.stats.correct}</b></div>
        <div class="no">틀린 문제<b>${q.stats.wrong}</b></div>
      </div>
    </div>
    ${wrongHtml}
    <button class="btn btn-primary" onclick="startQuiz('${type}')">같은 조건으로 다시 풀기</button>
    <button class="btn btn-secondary" onclick="renderQuizSetup('${type}')">출제 범위 다시 설정하기</button>
  `;

  wrongItems.forEach(w=>{
    const el = area.querySelector(`.wrong-item[data-no="${w.no}"] .star`);
    if(el){
      el.addEventListener('click', ()=>{
        w.fav = !w.fav;
        saveFavoritesToStorage();
        updateFavBadge();
        el.classList.toggle('active', w.fav);
        el.textContent = w.fav ? '★' : '☆';
      });
    }
  });
}

/* =======================================================
   7. 탭 전환
   ======================================================= */
const PAGE_IDS = { list:'page-list', fav:'page-fav', blank:'page-quiz', spell:'page-spell', choice:'page-choice' };
const TAB_BTN_IDS = { list:'tabBtnList', fav:'tabBtnFav', blank:'tabBtnQuiz', spell:'tabBtnSpell', choice:'tabBtnChoice' };

function switchTab(tab){
  Object.keys(PAGE_IDS).forEach(t=>{
    document.getElementById(PAGE_IDS[t]).classList.toggle('active', tab === t);
    document.getElementById(TAB_BTN_IDS[t]).classList.toggle('active', tab === t);
  });

  if(tab === 'fav') buildFavList();
  if((tab === 'blank' || tab === 'spell' || tab === 'choice') && !quiz[tab].started){
    renderQuizSetup(tab);
  }
}

/* =======================================================
   초기 실행
   ======================================================= */
buildWordList();
buildFavList();
</script>
